		<script>
			const $ = (sel, root) => (root || document).querySelector(sel);

			function esc(val) {
				if (val == null) return "";
				return String(val).replace(/[&<>"']/g, function(ch) {
					switch (ch) {
						case "&":
							return "&amp;";
						case "<":
							return "&lt;";
						case ">":
							return "&gt;";
						case '"':
							return "&quot;";
						case "'":
							return "&#39;";
						default:
							return ch
					}
				})
			}
			const dd = p => p && p.derived || {};
			const fmtM = n => n == null ? "-" : n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
			const fmtN = n => n == null ? "-" : Number(n).toLocaleString("en-US");
			const pct = n => n == null || isNaN(n) ? "-" : (n > 0 ? "+" : "") + Number(n).toFixed(1) + "%";
			const img = (src, cls) => src ? '<img src="' + esc(src) + '" class="' + (cls || "") + '" alt="" loading="lazy" onerror="this.style.opacity=.15">' : "";

			function timeAgo(str) {
				if (!str) return "-";
				try {
					const d = new Date(str);
					const days = Math.floor((Date.now() - d.getTime()) / 864e5);
					if (days <= 0) return "today";
					return days + "d ago"
				} catch (e) {
					return str
				}
			}
			const heroIcon = id => "images/kingshot/heroes/hero_headpic_" + id + ".png";

			function heroName(id, player) {
				const key = String(id);
				if (NAMES && NAMES.hero && NAMES.hero[key]) return NAMES.hero[key];
				if (player && Array.isArray(player.heroes)) {
					for (let i = 0; i < player.heroes.length; i++) {
						const h = player.heroes[i];
						if (String(h.hero_id) === key && h.name) return h.name
					}
				}
				return "Unknown hero"
			}

			function widgetIcon(id, player) {
				const name = heroName(id, player);
				if (!name || name === "Unknown hero") return null;

			}

			function widgetLevelFromHero(hero) {

				if (lv == null || isNaN(Number(lv))) return null;

			}

			function plusTierClass(plus) {
				if (plus <= 0) return "";
				if (plus <= 19) return "p-grey";
				if (plus <= 39) return "p-green";
				if (plus <= 59) return "p-sky";
				if (plus <= 79) return "p-purple";
				if (plus <= 99) return "p-mango";
				return "p-red"
			}
			let D = {};
			let NAMES = {
				hero: {}
			};
			let P = [];
			const state = {
				sortKey: "combat",
				sortDir: -1,
				search: "",
				overall: new Set,
				excludeTransfers: false
			};
			let RK = {},
				OV = {},
				OP = {};
			const TRANSFER_NAMES = ["Alcadraz", "Phyenty", "MonkDragz", "⫷ ꌦꇙꊰ05⫸", "ShadowNv", "HAHAO", "whoopty doo", "Lord Fartquaad", "NotyourKen"];

			function normName(str) {
				return String(str || "").normalize("NFKC").replace(/[\u200B-\u200D\uFEFF]/g, "").replace(/\s+/g, " ").trim().toLowerCase()
			}

			function stripTags(str) {
				return String(str || "").normalize("NFKC").replace(/[\u200B-\u200D\uFEFF]/g, "").replace(/[ᴰᴱᵂᵀᴴᶠ²ᴾ\s·•.&'’]/g, "").toLowerCase()
			}
			const TRANSFER_SET = new Set(TRANSFER_NAMES.map(normName));
			const TRANSFER_SET_STRIPPED = new Set(TRANSFER_NAMES.map(stripTags));

			function isTransferPlayer(player) {
				if (!player || !player.nickname) return false;
				const n = normName(player.nickname);
				if (TRANSFER_SET.has(n)) return true;

			function transferBadgeHTML() {

			}
			const GOV_BLOCKS = [
				[3, "Rare", 0],
				[7, "Epic", 0],
				[11, "Epic", 1],
				[15, "Mythic", 0],
				[19, "Mythic", 1],
				[23, "Mythic", 2],
				[27, "Mythic", 3],
				[31, "Legendary", 0],
				[35, "Legendary", 1],
				[39, "Legendary", 2],
				[43, "Legendary", 3],
				[47, "Legendary", 4]
			];

			function govCode(g) {
				if (g.progress != null && !isNaN(Number(g.progress))) return Number(g.progress);
				const e = Number(g.equip_id) || 0;
				if (!e) return null;
				let c = e % 1e3;
				if (c >= 100) c = c % 100;
				return c
			}

			function govDecode(c) {
				if (c == null) return null;
				if (c <= 2) return {
					quality: "Uncommon",
					tier: 0,
					stars: 0
				};
				let b = GOV_BLOCKS[0];
				for (let i = 0; i < GOV_BLOCKS.length; i++) {
					if (c >= GOV_BLOCKS[i][0]) b = GOV_BLOCKS[i]
				}
				return {
					quality: b[1],
					tier: b[2],
					stars: Math.min(3, c - b[0])
				}
			}

			function govEffective(g) {
				if (!g) return null;
				const q = (g.quality || "").toLowerCase().trim();
				if (g.decoded === "label" && (q || g.tier != null || g.stars != null)) {
					return {
						quality: q || null,
						tier: Number(g.tier) || 0,
						stars: Number(g.stars) || 0
					}
				}
				return govDecode(govCode(g))
			}

			function govLabelOf(d) {
				return d ? d.quality + (d.tier ? " T" + d.tier : "") + (d.stars ? " · " + d.stars + "★" : "") : "-"
			}

			function govProgress(player) {
				const cs = (player.governor_gear || []).map(govCode).filter(c => c != null);
				return cs.length ? cs.reduce((a, b) => a + b, 0) : null
			}
			const Q_SUFFIX_TO_QUALITY = {
				1: "uncommon",
				2: "rare",
				3: "epic",
				4: "mythic",
				5: "legendary",
				6: "legendary",
				7: "mythic"
			};
			const ICON_RE = /lordsequipment_icon_\d+(\d)\.png$/;

			function qualityFromIcon(path) {
				if (!path) return null;
				const m = ICON_RE.exec(String(path).replace(/\\/g, "/"));
				return m ? Q_SUFFIX_TO_QUALITY[m[1]] || null : null
			}

			function govQuality(g) {
				const raw = (g.quality || "").toLowerCase().trim();
				if (raw === "legendary" || raw === "mythic" || raw === "epic" || raw === "rare" || raw === "uncommon") return raw;
				const qIcon = qualityFromIcon(g.icon);
				if (qIcon) return qIcon;
				const dq = govDecode(govCode(g));
				if (dq) return dq.quality.toLowerCase();
				return "unknown"
			}

			function govQualityClass(g) {
				switch (govQuality(g)) {
					case "legendary":
						return "q-legendary";
					case "mythic":
						return "q-mythic";
					case "epic":
						return "q-epic";
					case "rare":
						return "q-rare";
					case "uncommon":
						return "q-uncommon";
					default:
						return "q-unknown"
				}
			}

			function govIconPath(g) {
				if (g.icon && qualityFromIcon(g.icon) === govQuality(g)) return g.icon;
				const eid = Number(g.equip_id) || 0;
				if (!eid) return g.icon || null;
				const piece = Math.floor(eid / 1e3);
				const eff = govEffective(g) || {};
				const q = (eff.quality || "").toLowerCase();
				const tier = eff.tier || 1;
				let digit = null;
				if (q === "legendary") digit = tier >= 4 ? 6 : 5;
				else if (q === "mythic") digit = tier >= 2 ? 7 : 4;
				else if (q === "epic") digit = 3;
				else if (q === "rare") digit = 2;
				else if (q === "uncommon") digit = 1;
				if (digit != null) return "images/kingshot/lord-gear/lordsequipment_icon_" + piece + "00" + digit + ".png";
				return g.icon || null
			}
			const CATS = [{

			}, {

			}, {

			}];
			const CAT = {};
			for (let i = 0; i < CATS.length; i++) CAT[CATS[i].id] = CATS[i];
			const TROOPS = ["infantry", "cavalry", "archers"];
			state.overall.add("combat");

			function ranksFrom(pairs) {
				const o = {};
				let r = 0,
					prev = null,
					i = 0;
				pairs.sort((a, b) => b[1] - a[1]);
				for (let j = 0; j < pairs.length; j++) {
					const k = pairs[j][0],
						v = pairs[j][1];
					i++;
					if (v !== prev) {
						r = i;
						prev = v
					}
					o[k] = r
				}
				return o
			}

			function compute() {
				RK = {};
				for (let i = 0; i < CATS.length; i++) {
					const c = CATS[i];
					RK[c.id] = ranksFrom(P.map(p => [p.fid, c.get(p)]).filter(x => x[1] != null && !isNaN(x[1])))
				}
				OV = {};
				const ticked = Array.from(state.overall);
				for (let i = 0; i < P.length; i++) {
					const p = P[i];
					const rs = ticked.map(id => RK[id] && RK[id][p.fid]).filter(x => x != null);
					OV[p.fid] = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null
				}
				const ord = P.map(p => [p.fid, OV[p.fid]]).filter(x => x[1] != null).sort((a, b) => a[1] - b[1]);
				OP = {};
				let r = 0,
					prev = null,
					i = 0;
				for (let j = 0; j < ord.length; j++) {
					const k = ord[j][0],
						v = ord[j][1];
					i++;
					if (v !== prev) {
						r = i;
						prev = v
					}
					OP[k] = r
				}
			}

			function byFid(fid) {
				for (let i = 0; i < P.length; i++)
					if (P[i].fid === fid) return P[i];
				return null
			}

			function rankChip(r) {

			}

			function troopCell(p) {

				}
				return parts.length ? '<div class="troop-cell">' + parts.join("") + "</div>" : '<span class="text-slate-400">-</span>'
			}

			function govLabel(player) {
				const gears = player.governor_gear || [];
				if (!gears.length) return "-";
				const Q_ORDER = {
					uncommon: 0,
					rare: 1,
					epic: 2,
					mythic: 3,
					legendary: 4
				};
				let best = null;
				for (let i = 0; i < gears.length; i++) {
					const g = gears[i];
					const eff = govEffective(g);
					const q = eff ? (eff.quality || "").toLowerCase().trim() : "";
					if (!q && !g.label) continue;
					const tier = eff ? eff.tier || 0 : 0;
					const stars = eff ? eff.stars || 0 : 0;
					const score = (Q_ORDER[q] != null ? Q_ORDER[q] : -1) * 100 + tier * 10 + stars;
					if (!best || score > best.score) {
						best = {
							score,
							label: g.label || (eff ? govLabelOf(eff) : null)
						}
					}
				}
				if (best && best.label) return best.label;
				const cs = gears.map(govCode).filter(c => c != null);
				if (!cs.length) return "-";
				return govLabelOf(govDecode(Math.round(cs.reduce((a, b) => a + b, 0) / cs.length)))
			}

			function govGearImages(p) {
				const gears = p.governor_gear || [];

				}

			function tableRows() {
				const q = state.search;
				let rows = P.filter(p => !q || (p.nickname || "").toLowerCase().indexOf(q) !== -1);
				if (state.excludeTransfers) rows = rows.filter(p => !p.isTransfer);
				const k = state.sortKey;
				const val = p => {
					if (k === "overall") return OV[p.fid];
					if (k === "name") return (p.nickname || "").toLowerCase();
					return CAT[k].get(p)
				};
				rows.sort((a, b) => {
					const x = val(a),
						y = val(b);
					if (x == null && y == null) return 0;
					if (x == null) return 1;
					if (y == null) return -1;
					return (x < y ? -1 : x > y ? 1 : 0) * state.sortDir
				});
				return rows
			}

			function renderStats() {

				const furnaces = P.map(p => p.furnaceLevel).filter(x => x != null);

				const transferCount = P.filter(p => p.isTransfer).length;
				const card = (label, value, sub, icon, color) => '<div class="bg-white rounded-2xl shadow-sm p-5 hover:shadow-md transition"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><div class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">' + label + '</div><div class="text-2xl font-bold mt-1 tabular-nums">' + value + '</div><div class="text-[11.5px] text-slate-500 mt-1 truncate">' + sub + '</div></div><div class="w-14 h-14 rounded-2xl flex items-center justify-center flex-none ' + color + '"><i class="fas ' + icon + ' text-xl"></i></div></div></div>';
				$("#statGrid").innerHTML = card("Members", total, "avg combat <b>" + fmtM(Math.round(avg(combats))) + "</b>", "fa-users", "bg-blue-100 text-blue-600") + card("Top combat", top ? fmtM(top.combatPower) : "-", top ? esc(top.nickname) : "-", "fa-crown", "bg-yellow-100 text-yellow-600") + card("New transfers", transferCount, transferCount ? "<b>" + transferCount + "</b> recently joined DEW" : "none matched", "fa-arrow-right-to-bracket", "bg-amber-100 text-amber-600") + card("Avg furnace level", furnaces.length ? avg(furnaces).toFixed(1) : "-", "max <b>" + (furnaces.length ? Math.max.apply(null, furnaces) : "-") + "</b>", "fa-fire", "bg-rose-100 text-rose-600") + card("Total champ kills", fmtM(champKills.reduce((a, b) => a + b, 0)), champKills.length + " players with data", "fa-skull", "bg-purple-100 text-purple-600") + card("Data freshness", oldest && oldest.ageDays ? oldest.ageDays + "d" : "fresh", oldest && oldest.ageDays ? esc(oldest.nickname) + " is oldest" : "all data &lt; 7d", "fa-clock", "bg-sky-100 text-sky-600")
			}

			function renderCatToggles() {
				const out = [];
				for (let i = 0; i < CATS.length; i++) {
					const c = CATS[i];
					const on = state.overall.has(c.id);
					out.push('<label class="chip-toggle ' + (on ? "on" : "") + '"><input type="checkbox" data-c="' + c.id + '" class="hidden" ' + (on ? "checked" : "") + '><span class="dot"></span>' + esc(c.label) + "</label>")
				}
				$("#overallcats").innerHTML = out.join("")
			}

			function sec(title, body, hint) {
				return '<div class="mb-7"><h3 class="sec-h">' + esc(title) + (hint ? ' <span class="hint">' + hint + "</span>" : "") + "</h3>" + body + "</div>"
			}

			function kvBlock(entries) {
				const rows = [];
				for (let i = 0; i < entries.length; i++) {
					const e = entries[i];
					if (!e || e[1] == null || e[1] === "") continue;
					rows.push("<div><span>" + esc(e[0]) + "</span><span>" + esc(e[1]) + "</span></div>")
				}
				return rows.length ? '<div class="kv grid grid-cols-1 md:grid-cols-2 gap-x-8">' + rows.join("") + "</div>" : ""
			}

			function coreBlock(p) {
				return sec("Overview", kvBlock([
					["Nickname", p.nickname],
					["Player ID", p.fid || p.spec && p.spec["Player ID"]],
					["New transfer", p.isTransfer ? "Yes — recently joined DEW" : null],
					["Combat power", fmtM(p.combatPower)],
					["Total power", p.power != null ? fmtM(p.power) : null],
					["Hero power", fmtM(p.heroPower)],
					["Town Center", p.furnaceLevel]
				]))
			}

			function leadBlock(p) {
				const lead = p.lead || [];
				if (!lead.length) return "";
				const chips = lead.map(l => {
					const nm = heroName(l.id, p);
					return '<span class="chip" style="gap:8px">' + '<img src="' + esc(heroIcon(l.id)) + '" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.12)" onerror="this.style.opacity=.15">' + "<b>" + esc(nm) + "</b>" + "</span>"
				}).join("");
				return sec("Lead heroes", '<div class="flex flex-wrap gap-2.5">' + chips + "</div>")
			}

			function troopsBlock(p) {
				const t = p.troops || {};
				if (!Object.keys(t).length) return sec("Troops", '<div class="text-slate-400 text-sm">No troop data.</div>');
				const cards = [];
				for (let i = 0; i < TROOPS.length; i++) {
					const k = TROOPS[i];
					if (!t[k]) continue;
					cards.push('<div class="flex items-center gap-3 bg-slate-50 border border-slate-100 rounded-xl px-4 py-3">' + img(t[k].icon, "w-14 h-14 rounded-lg") + '<div><div class="text-sm font-semibold capitalize">' + esc(k) + '</div><div class="text-[11.5px] text-slate-500">Tier ' + t[k].tier + " · TG " + t[k].tg + "</div></div></div>")
				}
				return sec("Troops (top tier per type)", '<div class="flex flex-wrap gap-3">' + cards.join("") + "</div>")
			}

			function heroGearClass(g) {
				const t = Number(g.tier),
					e = Number(g.enhance) || 0;
				if (t === 5) return e > 100 ? "gi t5r" : "gi t5";
				if (t === 4) return "gi t4";
				if (t === 3) return "gi t3";
				if (t === 2) return "gi t2";
				return "gi t1"
			}

			function heroHTML(h, p) {
				const gear = (h.gear || []).map(g => {
					const tip = (g.name || "Gear") + " · Forge " + g.refine + " · Lv" + g.enhance_level + (g.enhance_plus ? " +" + g.enhance_plus : "") + (g.exp != null ? " · XP " + g.exp : "");
					const forge = g.refine != null && Number(g.refine) > 0 ? '<span class="gear-forge-badge"><img src="images/kingshot/items/item_icon_500240.png" alt="">Lv. ' + g.refine + "</span>" : "";
					const plus = Number(g.enhance_plus) || 0;
					const plusTier = plusTierClass(plus);
					const plusBadge = plus > 0 ? '<span class="gear-plus-badge ' + plusTier + '">+' + plus + "</span>" : "";
					const baseLevel = g.enhance_level != null ? g.enhance_level : 0;
					const baseLine = '<span class="block text-[11px] text-slate-700 mt-1 tabular-nums font-semibold">' + baseLevel + "</span>";
					return '<div class="text-center relative" title="' + esc(tip) + '">' + img(g.icon, heroGearClass(g)) + forge + plusBadge + baseLine + "</div>"
				}).join("");
				const wLvl = widgetLevelFromHero(h);
				const wSrc = widgetIcon(h.hero_id, p);
				let widgetTile = "";
				if (wLvl != null) {
					widgetTile = '<div class="widget-tile" title="Hero widget · Level ' + wLvl + '">' + '<div class="widget-frame">' + (wSrc ? '<img src="' + esc(wSrc) + '" alt="" loading="lazy" onerror="this.style.opacity=.25">' : "") + '<span class="wlv">+' + wLvl + "</span>" + "</div>" + '<span class="widget-label"></span>' + "</div>"
				}
				const ex = h.exclusive ? "" : "";
				const rawStars = Math.max(0, Number(h.star) || 0);
				const heroStars = Math.floor(rawStars / 6) + rawStars % 6 / 10;
				const starLabel = Number.isInteger(heroStars) ? String(heroStars) : heroStars.toFixed(1);
				const name = heroName(h.hero_id, p) || h.name || "Hero " + h.hero_id;
				const gearCols = wLvl != null ? "grid-cols-5" : "grid-cols-4";
				return '<div class="bg-slate-50 border border-slate-100 rounded-xl p-4 h-full flex flex-col">' + '<div class="flex items-center gap-3 mb-2">' + img(h.icon, "w-16 h-16 rounded-xl object-cover border-2 border-white shadow-sm flex-none") + '<div class="min-w-0"><div class="font-semibold text-[15px] truncate">' + esc(name) + '</div><div class="text-[12px] text-slate-500">' + starLabel + "★ · Lv" + (h.level != null ? h.level : "-") + ex + "</div></div>" + "</div>" + '<div class="grid ' + gearCols + ' gap-2 mt-auto pt-3">' + gear + widgetTile + "</div>" + "</div>"
			}

			function heroesBlock(p) {
				const hs = p.heroes || [];
				return hs.length ? sec("Heroes & hero gear", '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">' + hs.map(h => heroHTML(h, p)).join("") + "</div>") : ""
			}

			function govHTML(g) {
				const ch = (g.charms || []).map(c => '<div class="text-center w-12" title="Charm · raw ' + c.raw + " · level guess " + c.level_guess + '">' + img(c.icon, "w-11 h-11 mx-auto rounded") + '<span class="block text-[12px] text-slate-600 font-bold tabular-nums mt-1">' + c.level_guess + "</span></div>").join("");
				const qc = govQualityClass(g);
				const iconPath = govIconPath(g);
				const imgs = iconPath ? '<img src="' + esc(iconPath) + '" class="gi2" alt="" loading="lazy" onerror="this.style.opacity=.15">' : "";
				const eff = govEffective(g);
				const nstars = eff ? eff.stars || 0 : 0;
				const stars = nstars ? '<span class="st">' + "★".repeat(nstars) + "</span>" : "";
				const label = g.label || (eff ? govLabelOf(eff) : g.quality || "");
				return '<div class="gov-gear-card flex items-center gap-4 bg-slate-50 border border-slate-100 rounded-xl p-3.5"><div class="modal-gear-wrapper ' + qc + '">' + imgs + stars + '</div><div class="flex-1 min-w-0"><div class="text-[15px] font-semibold truncate">' + esc(g.name || "Gear piece") + '</div><div class="text-[13px] text-slate-600 mt-0.5">' + esc(label) + "</div>" + (g.equip_id != null ? '<div class="text-[11px] text-slate-400 mt-0.5"> ' + "</div>" : "") + '</div><div class="flex gap-2 flex-none">' + (ch || '<span class="text-slate-400 text-xs">No charms</span>') + "</div></div>"
			}

			function govBlock(p) {
				const g = p.governor_gear || [];
				if (!g.length) return "";
				return sec("Governor gear & charms", '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' + g.map(govHTML).join("") + "</div>", "")
			}

			function marchBlock(p) {
				const m = p.march_stats || {};
				if (!Object.keys(m).length) return "";
				const types = ["infantry", "cavalry", "archer"];
				const stats = ["attack", "defense", "lethality", "health"];
				let tbl = '<div class="overflow-auto rounded-xl border border-slate-100"><table class="w-full text-sm"><thead><tr><th class="bg-slate-50 px-4 py-3 text-left text-[11px] uppercase tracking-wider text-slate-500"></th>';
				for (let i = 0; i < types.length; i++) tbl += '<th class="bg-slate-50 px-4 py-3 text-center text-[11px] uppercase tracking-wider text-slate-500">' + esc(types[i]) + "</th>";
				tbl += "</tr></thead><tbody>";
				for (let i = 0; i < stats.length; i++) {
					const stat = stats[i];
					tbl += '<tr><td class="px-4 py-2.5 text-slate-500 capitalize border-t border-slate-100">' + stat + "</td>";
					for (let j = 0; j < types.length; j++) {
						const v = (m[stat] || {})[types[j]] || "-";
						tbl += '<td class="px-4 py-2.5 text-center border-t border-slate-100 tabular-nums font-medium">' + esc(v) + "</td>"
					}
					tbl += "</tr>"
				}
				tbl += "</tbody></table></div>";
				return sec("March stats", tbl)
			}

			function detailBody(p) {
				return coreBlock(p) + leadBlock(p) + troopsBlock(p) + heroesBlock(p) + govBlock(p) + marchBlock(p)
			}

			function openPlayer(fid) {
				const p = byFid(fid);
				if (!p) return;
				const metaParts = ["Combat " + fmtM(p.combatPower), "Hero power " + fmtM(p.heroPower), "Furnace " + (p.furnaceLevel != null ? p.furnaceLevel : "-"), p.ageDays != null ? "data " + (p.ageDays === 0 ? "fresh" : p.ageDays + "d old") : null].filter(Boolean);
				$("#drawer").innerHTML = '<div class="sticky top-0 bg-white border-b border-slate-100 px-6 py-5 flex items-center gap-4 z-10 rounded-t-[18px]">' + avatar(p, true) + '<div class="min-w-0 flex-1"><h2 class="text-2xl font-bold truncate">' + esc(p.nickname) + '</h2><div class="text-[12.5px] text-slate-500 truncate">' + esc(metaParts.join(" · ")) + '</div></div><button class="w-10 h-10 rounded-full hover:bg-slate-100 text-slate-500 flex items-center justify-center flex-none" id="closeDrawer" aria-label="Close"><i class="fas fa-times text-lg"></i></button></div>' + '<div class="px-6 py-6">' + detailBody(p) + "</div>";
				$("#overlay").classList.add("active")
			}

			function closeDrawer() {
				$("#overlay").classList.remove("active")
			}
			document.addEventListener("click", function(e) {
				const closeBtn = e.target.closest("#closeDrawer");
				if (closeBtn) return closeDrawer();
				if (e.target.id === "overlay") return closeDrawer();
				const row = e.target.closest("[data-f]");
				if (row && !e.target.closest("a.player-link")) return openPlayer(row.getAttribute("data-f"));
				const link = e.target.closest("a.player-link");
				if (link) {
					e.preventDefault();
					return openPlayer(link.getAttribute("data-f"))
				}
				const hcell = e.target.closest(".grid-header[data-k]");
				if (hcell) {
					const k = hcell.getAttribute("data-k");
					if (state.sortKey === k) state.sortDir *= -1;
					else {
						state.sortKey = k;
						state.sortDir = 1
					}
					renderTable()
				}
			});
			document.addEventListener("keydown", function(e) {
				if (e.key === "Escape") closeDrawer()
			});

			function wireToggles() {
				const ex = $("#excludeTransfers");
				if (ex) ex.addEventListener("click", function() {
					state.excludeTransfers = !state.excludeTransfers;
					ex.classList.toggle("on", state.excludeTransfers);
					renderTable()
				});
				const q = $("#q");
				if (q) q.addEventListener("input", function() {
					state.search = q.value.trim().toLowerCase();
					renderTable()
				});
				const cats = $("#overallcats");
				if (cats) cats.addEventListener("change", function(e) {
					const cb = e.target.closest("input[data-c]");
					if (!cb) return;
					const id = cb.getAttribute("data-c");
					if (cb.checked) state.overall.add(id);
					else state.overall.delete(id);
					renderCatToggles();
					compute();
					renderTable()
				});
				const csv = $("#csv");
				if (csv) csv.addEventListener("click", exportCSV)
			}

			function exportCSV() {
				const cols = ["fid", "nickname", "combatPower", "heroPower", "overall_rank"];
				for (let i = 0; i < CATS.length; i++) cols.push(CATS[i].id + "_rank");
				cols.push("gov_label", "charm_sum", "troop_score");
				const lines = [cols.join(",")];
				const rows = tableRows();
				for (let i = 0; i < rows.length; i++) {
					const p = rows[i];
					const vals = [p.fid, p.nickname, p.combatPower, p.heroPower, OP[p.fid] || ""];
					for (let j = 0; j < CATS.length; j++) vals.push(RK[CATS[j].id] && RK[CATS[j].id][p.fid] || "");
					vals.push(govLabel(p), dd(p).charm_level_sum_guess || "", dd(p).troop_score || "");
					lines.push(vals.map(v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(","))
				}
				const blob = new Blob([lines.join("\n")], {
					type: "text/csv"
				});
				const a = document.createElement("a");
				a.href = URL.createObjectURL(blob);
				a.download = "alliance.csv";
				a.click()
			}
			async function loadNames() {
				try {
					const r = await fetch("names.json", {
						cache: "no-store"
					});
					if (!r.ok) return;
					const j = await r.json();
					if (j && j.hero) NAMES.hero = j.hero
				} catch (e) {}
			}
			async function load() {
				$("#loader").classList.remove("hidden");
				await loadNames();
				try {
					const r = await fetch("alliance_full.json", {
						cache: "no-store"
					});
					if (!r.ok) throw new Error("HTTP " + r.status);
					D = await r.json()
				} catch (e) {
					$("#loader").innerHTML = '<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm p-10 text-center"><div class="text-rose-500 text-4xl mb-3"><i class="fas fa-triangle-exclamation"></i></div><p class="text-slate-700 font-semibold">Could not load alliance_full.json</p><p class="text-slate-500 text-sm mt-1">' + esc(e.message) + '</p><p class="text-slate-400 text-xs mt-3">Run capture.py first, then serve this folder over HTTP (e.g. <code>python -m http.server</code>).</p></div>';
					return
				}
				P = (D.players || []).map(p => Object.assign({}, p, {
					isTransfer: isTransferPlayer(p)
				}));
				const a = D.alliance || {};
				$("#title").textContent = a.name || "Alliance";
				$("#subtitle").textContent = (a.abbr ? "[" + a.abbr + "] · " : "") + "AID " + (a.aid || "-") + " · " + P.length + " players";
				$("#memberCount").textContent = P.length + " members";
				$("#brandLogo").textContent = (a.abbr || a.name || "A").trim().charAt(0).toUpperCase();
				document.title = (a.name || "Alliance") + " · Data Viewer";
				compute();
				renderCatToggles();
				renderTable();
				renderStats();
				wireToggles();
				$("#loader").classList.add("hidden");
				$("#page").classList.remove("hidden")
			}
			load().catch(function(error) {
				console.error("Alliance viewer error:", error);
				const loader = $("#loader");
				loader.classList.remove("hidden");
				loader.innerHTML = '<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm p-10 text-center">' + '<div class="text-rose-500 text-4xl mb-3">' + '<i class="fas fa-triangle-exclamation"></i></div>' + '<p class="text-slate-700 font-semibold">Something went wrong</p>' + '<p class="text-slate-500 text-sm mt-2">' + esc(error.message || String(error)) + "</p></div>"
			});

		</script>
	</body>

</html>
